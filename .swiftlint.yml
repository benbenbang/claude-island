excluded:
  - .build
  - Carthage
  - Pods
  - "**/Generated"
  - "**/*.generated.swift"

allow_zero_lintable_files: true
check_for_updates: false

# Rule tuning -----------------------------------------------------------------
# This is inherited fork code with a graphics / parsing style: short coordinate
# and index names (x, y, i, r, ...) and some large view/parser files. Rules stay
# ON but with relaxed thresholds so CI (which runs without --strict) passes on
# error-level violations, while the remaining debt still surfaces as warnings.

identifier_name:
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 160
  error: 300

file_length:
  warning: 800
  error: 2000

  ignore_comment_only_lines: true

type_body_length:
  warning: 500
  error: 1500

function_body_length:
  warning: 80
  error: 300

cyclomatic_complexity:
  warning: 15
  error: 40

large_tuple:
  warning: 3
  error: 5

shorthand_operator:
  severity: warning
