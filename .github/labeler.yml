enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - "ClaudeIsland/**/*"
          - "ClaudeIsland.xcodeproj/**/*"

workflows:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - ".releaserc.json"
          - ".pre-commit-config.yaml"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.lock"
          - "Cargo.toml"
          - "package.json"
          - "package-lock.json"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - "**/*.md"
          - "docs/**/*.md"
          - "docs/mkdocs.yml"
